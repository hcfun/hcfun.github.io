intro: >-
  方海川，中共党员，郑州大学计算机与人工智能学院软件工程专业在读博士研究生，
  主要从事知识图谱表示学习、信息瓶颈理论及生物信息等方向研究。博士阶段参与多项
  国家自然科学基金项目，在 ACM Multimedia、IEEE Transactions on Systems, Man,
  and Cybernetics: Systems、Expert Systems with Applications 及 IEEE/ACM Transactions
  on Computational Biology and Bioinformatics 等会议或期刊上发表多篇学术论文。
  获得博士研究生国家奖学金、河南省优秀学生干部及郑州大学优秀成果奖等荣誉。

