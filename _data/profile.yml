research_areas:
  - Knowledge Representation Learning
  - Graph Representation Learning
  - Data Mining
  - Information Bottleneck
  - Bioinformatics

research_summary: >-
  目前主要关注常规、时序及多模态知识图谱的表示学习，探索信息瓶颈等理论与知识表示学习的结合，
  以及知识表示学习在生物实体预测、推荐系统和智能问答等场景中的应用。

