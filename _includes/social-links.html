<div class="social-links" aria-label="学术与联系方式">
  {% if site.owner.email %}<a href="mailto:{{ site.owner.email }}">Email</a>{% endif %}
  {% if site.owner.scholar %}<a href="{{ site.owner.scholar }}">Google Scholar</a>{% endif %}
  {% if site.owner.github %}<a href="https://github.com/{{ site.owner.github }}">GitHub</a>{% endif %}
  {% if site.owner.orcid %}<a href="{{ site.owner.orcid }}">ORCID</a>{% endif %}
  {% if site.owner.dblp %}<a href="{{ site.owner.dblp }}">DBLP</a>{% endif %}
  {% if site.owner.rg %}<a href="{{ site.owner.rg }}">ResearchGate</a>{% endif %}
</div>
