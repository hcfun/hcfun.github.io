<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10292e">

{% assign meta_title = page.title | default: site.title %}
{% assign meta_description = page.description | default: site.description %}
<title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }} | {{ site.title_en }}</title>
<meta name="description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:title" content="{{ meta_title | escape }}">
<meta property="og:description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:image" content="{{ '/images/og-card.png' | absolute_url }}">
<meta property="og:image:alt" content="Haichuan Fang Academic Profile">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ '/images/og-card.png' | absolute_url }}">

{% if site.google_verify %}<meta name="google-site-verification" content="{{ site.google_verify }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
