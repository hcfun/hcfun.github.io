---
layout: default
---
<article class="container article-page" itemscope itemtype="https://schema.org/ScholarlyArticle">
  <header class="article-header">
    <p class="eyebrow">{{ page.date | date: "%Y.%m.%d" }}</p>
    <h1 itemprop="headline">{{ page.title }}</h1>
  </header>
  <div class="prose" itemprop="articleBody">
    {{ content }}
  </div>
</article>
